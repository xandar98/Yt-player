<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>StreamWave Player</title>
  
  <!-- Telegram WebApp SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <!-- Phosphor Icons -->
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.0.3/src/regular/style.css">

  <style>
    :root {
      --bg-color: #0b0f19;
      --card-bg: rgba(23, 32, 54, 0.65);
      --card-border: rgba(255, 255, 255, 0.08);
      --accent: #38bdf8;
      --accent-glow: rgba(56, 189, 248, 0.35);
      --text: #f1f5f9;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 14px;
      overflow-x: hidden;
    }

    .app-container {
      width: 100%;
      max-width: 440px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* Glass Header */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 16px;
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border-radius: 18px;
      border: 1px solid var(--card-border);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 700;
      font-size: 1.1rem;
      color: var(--accent);
    }

    /* Mode Toggle Switch */
    .mode-switch-wrapper {
      display: flex;
      background: rgba(0, 0, 0, 0.4);
      padding: 3px;
      border-radius: 20px;
      border: 1px solid var(--card-border);
    }

    .mode-btn {
      display: flex;
      align-items: center;
      gap: 6px;
      border: none;
      background: transparent;
      color: var(--text-muted);
      padding: 6px 14px;
      font-size: 0.8rem;
      font-weight: 600;
      border-radius: 16px;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .mode-btn.active {
      background: var(--accent);
      color: #0b0f19;
      box-shadow: 0 0 12px var(--accent-glow);
    }

    /* Player Display Card */
    .media-card {
      position: relative;
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      border-radius: 24px;
      border: 1px solid var(--card-border);
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow: hidden;
      min-height: 280px;
      justify-content: center;
    }

    /* Video Frame Container */
    #video-wrapper {
      width: 100%;
      border-radius: 16px;
      overflow: hidden;
      aspect-ratio: 16 / 9;
      background: #000;
      display: none;
    }

    #video-wrapper iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    /* Audio Vinyl & Visualizer UI */
    #audio-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      padding: 10px 0;
      width: 100%;
    }

    .disc-container {
      position: relative;
      width: 170px;
      height: 170px;
      border-radius: 50%;
      background: radial-gradient(circle, #2d3748 10%, #111827 70%);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6), inset 0 0 10px rgba(255, 255, 255, 0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      animation: spin 12s linear infinite;
      animation-play-state: paused;
    }

    .disc-container.spinning {
      animation-play-state: running;
    }

    .disc-center {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 14px var(--accent-glow);
      display: flex;
      align-items: center;
      justify-content: center;
      border: 4px solid #111827;
      color: #0b0f19;
      font-size: 1.4rem;
    }

    @keyframes spin {
      100% { transform: rotate(360deg); }
    }

    /* Equalizer Bars */
    .bars-container {
      display: flex;
      align-items: flex-end;
      gap: 4px;
      height: 24px;
    }

    .bar {
      width: 4px;
      background: var(--accent);
      border-radius: 3px;
      height: 4px;
      transition: height 0.2s ease;
    }

    .playing .bar {
      animation: pulse 1s ease-in-out infinite alternate;
    }

    .playing .bar:nth-child(2) { animation-delay: 0.2s; }
    .playing .bar:nth-child(3) { animation-delay: 0.4s; }
    .playing .bar:nth-child(4) { animation-delay: 0.1s; }
    .playing .bar:nth-child(5) { animation-delay: 0.3s; }

    @keyframes pulse {
      0% { height: 4px; }
      100% { height: 22px; }
    }

    /* Song Metadata */
    .track-details {
      text-align: center;
      margin-top: 8px;
      width: 100%;
    }

    .track-title {
      font-size: 1.05rem;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .track-artist {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-top: 2px;
    }

    /* Scrubber / Progress Bar */
    .scrubber-container {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-top: 10px;
    }

    .seek-slider {
      -webkit-appearance: none;
      width: 100%;
      height: 5px;
      border-radius: 5px;
      background: rgba(255, 255, 255, 0.15);
      outline: none;
    }

    .seek-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--accent);
      cursor: pointer;
      box-shadow: 0 0 8px var(--accent-glow);
    }

    .timestamps {
      display: flex;
      justify-content: space-between;
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    /* Playback Controls */
    .controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 20px;
      margin-top: 14px;
    }

    .ctrl-btn {
      border: none;
      background: transparent;
      color: var(--text);
      font-size: 1.4rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.15s ease, color 0.2s ease;
    }

    .ctrl-btn:active {
      transform: scale(0.9);
    }

    .play-pause-btn {
      width: 54px;
      height: 54px;
      border-radius: 50%;
      background: var(--accent);
      color: #0b0f19;
      font-size: 1.8rem;
      box-shadow: 0 0 18px var(--accent-glow);
    }

    /* Search & Link Input Section */
    .input-section {
      background: var(--card-bg);
      border-radius: 20px;
      border: 1px solid var(--card-border);
      padding: 12px;
      display: flex;
      gap: 8px;
    }

    .url-input {
      flex: 1;
      background: rgba(0, 0, 0, 0.35);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 10px 14px;
      color: var(--text);
      font-size: 0.85rem;
      outline: none;
    }

    .url-input::placeholder {
      color: rgba(255, 255, 255, 0.3);
    }

    .url-input:focus {
      border-color: var(--accent);
    }

    .action-btn {
      background: var(--accent);
      color: #0b0f19;
      border: none;
      border-radius: 14px;
      padding: 0 16px;
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
    }

    /* Preset Song Playlist */
    .playlist-card {
      background: var(--card-bg);
      border-radius: 20px;
      border: 1px solid var(--card-border);
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .playlist-header {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 2px;
    }

    .playlist-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px;
      background: rgba(255, 255, 255, 0.03);
      border-radius: 12px;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    .playlist-item:hover, .playlist-item.active {
      background: rgba(56, 189, 248, 0.15);
      border: 1px solid rgba(56, 189, 248, 0.3);
    }

    .item-meta {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .item-name {
      font-size: 0.9rem;
      font-weight: 600;
    }

    .item-sub {
      font-size: 0.75rem;
      color: var(--text-muted);
    }
  </style>
</head>
<body>

  <div class="app-container">
    <!-- Header -->
    <header class="header">
      <div class="brand">
        <i class="ph ph-waveform"></i>
        <span>StreamWave</span>
      </div>

      <!-- Mode Toggle Switch -->
      <div class="mode-switch-wrapper">
        <button id="audio-toggle-btn" class="mode-btn active" onclick="setMode('audio')">
          <i class="ph ph-headphones"></i> Audio
        </button>
        <button id="video-toggle-btn" class="mode-btn" onclick="setMode('video')">
          <i class="ph ph-video-camera"></i> Video
        </button>
      </div>
    </header>

    <!-- Main Display (Video / Audio Mode) -->
    <main class="media-card">
      <!-- 16:9 Video Container -->
      <div id="video-wrapper">
        <div id="yt-player"></div>
      </div>

      <!-- Audio Mode Container (Vinyl & Equalizer) -->
      <div id="audio-wrapper">
        <div id="vinyl-disc" class="disc-container">
          <div class="disc-center">
            <i class="ph ph-music-note"></i>
          </div>
        </div>

        <div id="equalizer" class="bars-container">
          <div class="bar"></div>
          <div class="bar"></div>
          <div class="bar"></div>
          <div class="bar"></div>
          <div class="bar"></div>
        </div>
      </div>

      <!-- Metadata -->
      <div class="track-details">
        <div id="track-name" class="track-title">Tujhe Kitna Chahne Lage</div>
        <div id="artist-name" class="track-artist">Arijit Singh • Kabir Singh</div>
      </div>

      <!-- Scrubber -->
      <div class="scrubber-container">
        <input type="range" id="seek-bar" class="seek-slider" min="0" max="100" value="0">
        <div class="timestamps">
          <span id="current-time">0:00</span>
          <span id="total-duration">0:00</span>
        </div>
      </div>

      <!-- Bottom Controls -->
      <div class="controls">
        <button class="ctrl-btn" onclick="skip(-10)"><i class="ph ph-rewind"></i></button>
        <button id="play-btn" class="ctrl-btn play-pause-btn" onclick="togglePlay()"><i class="ph ph-play"></i></button>
        <button class="ctrl-btn" onclick="skip(10)"><i class="ph ph-fast-forward"></i></button>
      </div>
    </main>

    <!-- Search or YouTube Link Paste Input -->
    <section class="input-section">
      <input type="text" id="yt-url" class="url-input" placeholder="YouTube Video URL বা Video ID দিন...">
      <button class="action-btn" onclick="loadCustomVideo()">Play</button>
    </section>

    <!-- Playlist / Popular Tracks -->
    <section class="playlist-card">
      <div class="playlist-header">Featured Songs</div>

      <div class="playlist-item active" onclick="changeSong('AFmwzC9K76s', 'Tujhe Kitna Chahne Lage', 'Arijit Singh')">
        <div class="item-meta">
          <span class="item-name">Tujhe Kitna Chahne Lage</span>
          <span class="item-sub">Kabir Singh</span>
        </div>
        <i class="ph ph-play-circle" style="font-size: 1.3rem; color: var(--accent);"></i>
      </div>

      <div class="playlist-item" onclick="changeSong('Iltsbc5nh1c', 'Kahani Suno 2.0', 'Kaifi Khalil')">
        <div class="item-meta">
          <span class="item-name">Kahani Suno 2.0</span>
          <span class="item-sub">Kaifi Khalil</span>
        </div>
        <i class="ph ph-play-circle" style="font-size: 1.3rem; color: var(--accent);"></i>
      </div>

      <div class="playlist-item" onclick="changeSong('k4yXQkG2s1E', 'Dhurandhar Theme', 'KSHMR')">
        <div class="item-meta">
          <span class="item-name">Dhurandhar Sound</span>
          <span class="item-sub">Electronic / Orchestral</span>
        </div>
        <i class="ph ph-play-circle" style="font-size: 1.3rem; color: var(--accent);"></i>
      </div>
    </section>
  </div>

  <!-- YouTube IFrame API Script -->
  <script src="https://www.youtube.com/iframe_api"></script>

  <script>
    // Initialize Telegram WebApp
    if (window.Telegram && window.Telegram.WebApp) {
      window.Telegram.WebApp.ready();
      window.Telegram.WebApp.expand();
    }

    let player;
    let isPlaying = false;
    let currentMode = 'audio';
    let progressTimer = null;
    let currentVideoId = 'AFmwzC9K76s';

    // YouTube IFrame API Ready Callback
    function onYouTubeIframeAPIReady() {
      player = new YT.Player('yt-player', {
        videoId: currentVideoId,
        playerVars: {
          'playsinline': 1,
          'controls': 0,
          'disablekb': 1,
          'rel': 0,
          'modestbranding': 1
        },
        events: {
          'onReady': onPlayerReady,
          'onStateChange': onPlayerStateChange
        }
      });
    }

    function onPlayerReady(event) {
      document.getElementById('seek-bar').addEventListener('input', (e) => {
        const seekTo = (player.getDuration() * e.target.value) / 100;
        player.seekTo(seekTo, true);
      });
    }

    function onPlayerStateChange(event) {
      const disc = document.getElementById('vinyl-disc');
      const eq = document.getElementById('equalizer');
      const playIcon = document.getElementById('play-btn').querySelector('i');

      if (event.data === YT.PlayerState.PLAYING) {
        isPlaying = true;
        disc.classList.add('spinning');
        eq.classList.add('playing');
        playIcon.className = "ph ph-pause";
        startTracking();
      } else {
        isPlaying = false;
        disc.classList.remove('spinning');
        eq.classList.remove('playing');
        playIcon.className = "ph ph-play";
        clearInterval(progressTimer);
      }
    }

    function togglePlay() {
      if (!player || typeof player.playVideo !== 'function') return;
      if (isPlaying) {
        player.pauseVideo();
      } else {
        player.playVideo();
      }
    }

    function skip(seconds) {
      if (!player) return;
      const current = player.getCurrentTime();
      player.seekTo(current + seconds, true);
    }

    // Toggle between Video and Audio Mode
    function setMode(mode) {
      currentMode = mode;
      const audioBtn = document.getElementById('audio-toggle-btn');
      const videoBtn = document.getElementById('video-toggle-btn');
      const videoWrap = document.getElementById('video-wrapper');
      const audioWrap = document.getElementById('audio-wrapper');

      if (mode === 'video') {
        videoBtn.classList.add('active');
        audioBtn.classList.remove('active');
        videoWrap.style.display = 'block';
        audioWrap.style.display = 'none';
      } else {
        audioBtn.classList.add('active');
        videoBtn.classList.remove('active');
        videoWrap.style.display = 'none';
        audioWrap.style.display = 'flex';
      }
    }

    function startTracking() {
      clearInterval(progressTimer);
      progressTimer = setInterval(() => {
        if (!player || !player.getDuration) return;
        const current = player.getCurrentTime();
        const duration = player.getDuration();
        if (duration > 0) {
          const percent = (current / duration) * 100;
          document.getElementById('seek-bar').value = percent;
          document.getElementById('current-time').textContent = formatTime(current);
          document.getElementById('total-duration').textContent = formatTime(duration);
        }
      }, 500);
    }

    function formatTime(seconds) {
      const min = Math.floor(seconds / 60);
      const sec = Math.floor(seconds % 60);
      return `${min}:${sec < 10 ? '0' : ''}${sec}`;
    }

    // Change Song from Playlist
    function changeSong(id, title, artist) {
      currentVideoId = id;
      document.getElementById('track-name').textContent = title;
      document.getElementById('artist-name').textContent = artist;
      if (player && player.loadVideoById) {
        player.loadVideoById(id);
      }
    }

    // Load URL or Video ID from Input
    function loadCustomVideo() {
      const input = document.getElementById('yt-url').value.trim();
      if (!input) return;

      let extractedId = input;
      // Extract from standard YouTube URLs if pasted
      const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
      const match = input.match(regExp);

      if (match && match[2].length === 11) {
        extractedId = match[2];
      }

      document.getElementById('track-name').textContent = "Custom Stream";
      document.getElementById('artist-name').textContent = "YouTube Audio / Video";
      if (player && player.loadVideoById) {
        player.loadVideoById(extractedId);
      }
      document.getElementById('yt-url').value = '';
    }
  </script>
</body>
</html>
